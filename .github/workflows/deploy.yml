name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 发送飞书通知
        if: github.ref == 'refs/heads/main'
        run: |
          MD_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.md$' | head -5)
          if [ -n "$MD_FILES" ]; then
            echo "检测到文章变更，发送飞书通知..."
            curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"msg_type\": \"text\",
                \"content\": {
                  \"text\": \"📝 新文章已发布\n链接: https://ais.aitennis.top/\n变更: \$MD_FILES\"
                }
              }"
          fi
