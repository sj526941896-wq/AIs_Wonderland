<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Learning Journey - 我的 AI 学习之旅</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #22d3ee;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }

    header { text-align: center; margin-bottom: 3rem; }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .subtitle { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1rem; }

    .admin-link {
      display: inline-block;
      color: var(--accent);
      font-size: 0.9rem;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .admin-link:hover { opacity: 1; }

    .search-bar { margin-bottom: 2rem; }
    .search-bar input { width: 100%; padding: 1rem; font-size: 1.1rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
    .search-bar input::placeholder { color: var(--text-muted); }

    .filter-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }

    .filter-tag {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .filter-tag:hover, .filter-tag.active { background: var(--primary); color: white; border-color: var(--primary); }

    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--primary), var(--accent));
    }

    .entry {
      position: relative;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .entry::before {
      content: '';
      position: absolute;
      left: -2rem; top: 1.5rem;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      border: 3px solid var(--bg);
    }

    .entry-date { color: var(--accent); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .entry-title { font-size: 1.3rem; margin-bottom: 0.75rem; }
    .entry-content { color: var(--text-muted); margin-bottom: 1rem; white-space: pre-wrap; }

    .entry-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .entry-tag { background: var(--bg); color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }

    .entry-achievement {
      background: rgba(34, 211, 238, 0.1);
      border-left: 3px solid var(--accent);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
      margin-top: 1rem;
    }
    .entry-achievement strong { color: var(--accent); display: block; margin-bottom: 0.25rem; }

    .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Learning Journey</h1>
      <p class="subtitle">记录我的 AI 学习之旅</p>
      <a href="admin.html" class="admin-link">管理入口 →</a>
    </header>

    <section class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索学习记录...">
    </section>

    <section>
      <div class="filter-tags" id="filterTags"></div>
      <div class="timeline" id="timeline"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'ai_learning_journey';

    function loadEntries() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    function renderEntries(searchTerm = '') {
      const entries = loadEntries();
      const timeline = document.getElementById('timeline');
      const filterTagsContainer = document.getElementById('filterTags');

      let filtered = entries;
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(e =>
          e.title.toLowerCase().includes(term) ||
          e.content.toLowerCase().includes(term) ||
          e.achievement.toLowerCase().includes(term) ||
          e.tags.some(t => t.toLowerCase().includes(term))
        );
      }

      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      if (filtered.length === 0) {
        timeline.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📚</div>
            <p>还没有学习记录</p>
            <p>期待未来的精彩内容！</p>
          </div>
        `;
        filterTagsContainer.innerHTML = '';
        return;
      }

      timeline.innerHTML = filtered.map(entry => `
        <div class="entry">
          <div class="entry-date">${formatDate(entry.date)}</div>
          <h3 class="entry-title">${escapeHtml(entry.title)}</h3>
          ${entry.content ? `<p class="entry-content">${escapeHtml(entry.content)}</p>` : ''}
          ${entry.tags.length ? `<div class="entry-tags">${entry.tags.map(t => `<span class="entry-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${entry.achievement ? `<div class="entry-achievement"><strong>成果/心得</strong>${escapeHtml(entry.achievement)}</div>` : ''}
        </div>
      `).join('');

      const allTags = [...new Set(entries.flatMap(e => e.tags))];
      filterTagsContainer.innerHTML = `
        <span class="filter-tag active" onclick="setFilter(null)">全部</span>
        ${allTags.map(tag => `<span class="filter-tag" onclick="setFilter('${escapeHtml(tag)}')">${escapeHtml(tag)}</span>`).join('')}
      `;
    }

    function setFilter(tag) {
      document.querySelectorAll('.filter-tag').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      const term = document.getElementById('searchInput').value;
      if (tag) {
        const entries = loadEntries().filter(e => e.tags.includes(tag));
        renderFilteredEntries(entries, term);
      } else {
        renderEntries(term);
      }
    }

    function renderFilteredEntries(entries, searchTerm) {
      const timeline = document.getElementById('timeline');
      let filtered = entries;

      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(e =>
          e.title.toLowerCase().includes(term) ||
          e.content.toLowerCase().includes(term) ||
          e.achievement.toLowerCase().includes(term) ||
          e.tags.some(t => t.toLowerCase().includes(term))
        );
      }

      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      timeline.innerHTML = filtered.map(entry => `
        <div class="entry">
          <div class="entry-date">${formatDate(entry.date)}</div>
          <h3 class="entry-title">${escapeHtml(entry.title)}</h3>
          ${entry.content ? `<p class="entry-content">${escapeHtml(entry.content)}</p>` : ''}
          ${entry.tags.length ? `<div class="entry-tags">${entry.tags.map(t => `<span class="entry-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${entry.achievement ? `<div class="entry-achievement"><strong>成果/心得</strong>${escapeHtml(entry.achievement)}</div>` : ''}
        </div>
      `).join('');
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      renderEntries(e.target.value);
    });

    renderEntries();
  </script>
</body>
</html>
