<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 学习之旅 | 个人博客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #faf9f7;
      --card-bg: #ffffff;
      --text: #2d2a26;
      --text-muted: #6b6560;
      --border: #e8e4df;
      --accent: #e07a5f;
      --accent-hover: #c9694f;
      --tag-bg: #f3ebe6;
      --tag-text: #b85c3f;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
    }

    .container { max-width: 720px; margin: 0 auto; padding: 0 1.5rem; }

    /* Header / Profile */
    .profile {
      padding: 4rem 0 3rem;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #f4a261);
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
    }

    .profile h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .profile-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 480px;
      margin: 0 auto;
    }

    .admin-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 20px;
      transition: all 0.2s;
    }
    .admin-link:hover {
      background: var(--accent);
      color: white;
    }

    /* Search */
    .search-wrap {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(224, 122, 95, 0.1);
    }

    /* Filter Tags */
    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }

    .filter-tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.35rem 0.9rem;
      border-radius: 15px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .filter-tag:hover, .filter-tag.active {
      background: var(--accent);
      color: white;
    }

    /* Timeline */
    .timeline { position: relative; padding-left: 1.5rem; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .entry {
      position: relative;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .entry:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .entry::before {
      content: '';
      position: absolute;
      left: -1.5rem; top: 2rem;
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      border: 3px solid var(--bg);
    }

    .entry-date {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .entry-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .entry-content {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      white-space: pre-wrap;
    }

    .entry-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .entry-tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.2rem 0.6rem;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .entry-achievement {
      background: linear-gradient(135deg, #fdf8f6, #faf5f2);
      border-left: 3px solid var(--accent);
      padding: 0.9rem 1.1rem;
      border-radius: 0 10px 10px 0;
      margin-top: 1rem;
    }

    .entry-achievement-label {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .entry-achievement-content {
      color: var(--text);
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 3.5rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state p { font-size: 1rem; }
    .empty-state p:first-of-type { margin-bottom: 0.5rem; }

    /* Footer */
    .footer {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    @media (max-width: 600px) {
      .profile { padding: 3rem 0 2rem; }
      .profile h1 { font-size: 1.5rem; }
      .entry { padding: 1.25rem; }
      .entry-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="profile">
      <div class="avatar">📖</div>
      <h1>我的 AI 学习之旅</h1>
      <p class="profile-desc">记录成长的每一步，从基础到实践，持续探索人工智能的奥秘</p>
          </header>

    <section class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索学习记录...">
    </section>

    <section>
      <div class="filter-tags" id="filterTags"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <footer class="footer">
      <p>用心记录每一天的成长 🌱</p>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'ai_learning_journey';

    function loadEntries() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function renderEntries(searchTerm = '') {
      const entries = loadEntries();
      const timeline = document.getElementById('timeline');
      const filterTagsContainer = document.getElementById('filterTags');

      let filtered = entries;
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(e =>
          e.title.toLowerCase().includes(term) ||
          e.content.toLowerCase().includes(term) ||
          e.achievement.toLowerCase().includes(term) ||
          e.tags.some(t => t.toLowerCase().includes(term))
        );
      }

      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      if (filtered.length === 0) {
        timeline.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📝</div>
            <p>还没有学习记录</p>
            <p>期待与你分享第一篇内容</p>
          </div>
        `;
        filterTagsContainer.innerHTML = '';
        return;
      }

      timeline.innerHTML = filtered.map(entry => `
        <article class="entry">
          <div class="entry-date">${formatDate(entry.date)}</div>
          <h2 class="entry-title">${escapeHtml(entry.title)}</h2>
          ${entry.content ? `<p class="entry-content">${escapeHtml(entry.content)}</p>` : ''}
          ${entry.tags.length ? `<div class="entry-tags">${entry.tags.map(t => `<span class="entry-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${entry.achievement ? `
            <div class="entry-achievement">
              <div class="entry-achievement-label">✨ 成果与收获</div>
              <div class="entry-achievement-content">${escapeHtml(entry.achievement)}</div>
            </div>
          ` : ''}
        </article>
      `).join('');

      const allTags = [...new Set(entries.flatMap(e => e.tags))];
      filterTagsContainer.innerHTML = `
        <button class="filter-tag active" data-tag="">全部</button>
        ${allTags.map(tag => `<button class="filter-tag" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`).join('')}
      `;
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      renderEntries(e.target.value);
    });

    document.getElementById('filterTags').addEventListener('click', function(e) {
      if (e.target.classList.contains('filter-tag')) {
        document.querySelectorAll('.filter-tag').forEach(el => el.classList.remove('active'));
        e.target.classList.add('active');
        renderEntries(document.getElementById('searchInput').value);
      }
    });

    renderEntries();
  </script>
</body>
</html>
